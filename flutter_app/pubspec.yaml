name: meeting_translator_app
description: "Apple (macOS & iOS) Real-Time Meeting Speech Transcriber and Translator"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  record: ^5.2.0
  web_socket_channel: ^3.0.1
  window_manager: ^0.4.3
  provider: ^6.1.2
  intl: ^0.19.0
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.5.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_linux: 1.3.1
  record_platform_interface: 1.5.0

flutter:
  uses-material-design: true
